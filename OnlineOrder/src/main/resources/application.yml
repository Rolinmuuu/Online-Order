server:
  # On SIGTERM stop accepting requests and let in-flight ones finish (up to the timeout below)
  # before the connection pool and the outbox dispatcher shut down.
  shutdown: graceful
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:8h}   # idle time before a customer must sign in again
      cookie:
        # The session cookie is never sent on cross-site requests, so another site cannot make a
        # signed-in browser place, cancel or reject orders (CSRF tokens are off for this JSON API).
        same-site: strict
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}   # true wherever the site is served over HTTPS

app:
  # Demo mode: sample accounts (DevRunner) and the simulated card processor. Turn off anywhere real.
  demo: ${APP_DEMO:true}
  db:
    # Drop everything and migrate from scratch at startup (fresh demo stock). Demo mode only.
    reset-on-start: ${DB_RESET_ON_START:false}
  background-jobs:
    enabled: ${BACKGROUND_JOBS:true}

spring:
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_GRACE:20s}
  task:
    scheduling:
      pool:
        size: 4   # outbox dispatcher, expiry sweeper, SSE heartbeat and housekeeping don't queue behind each other
  jackson:
    default-property-inclusion: non_null
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:postgresql://${DATABASE_URL:localhost}:${DATABASE_PORT:5432}/onlineorder
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
  session:
    jdbc:
      initialize-schema: never   # V3__http_sessions.sql creates the tables
  flyway:
    # db/migration is the schema; db/seed is the sample menu (a repeatable migration). A real
    # deployment that manages its own menu sets FLYWAY_LOCATIONS=classpath:db/migration.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}
    # A database created by the old database-init.sql (no history table) is adopted as V1.
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: ${CACHE_TYPE:redis}
    redis:
      time-to-live: 60000

orders:
  pay-within-seconds: ${ORDER_PAY_WITHIN_SECONDS:900}   # unpaid orders are cancelled after this
  expiry-sweep-ms: 5000

payments:
  webhook-secret: ${PAYMENT_WEBHOOK_SECRET:dev-only-webhook-secret}
  simulated:
    delay-ms: 1200

outbox:
  poll-ms: 500

logging:
  # Plain text locally. In containers LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs switches to one JSON
  # object per line (with trace and span ids), which log pipelines index without parsing rules.
  level:
    root: INFO
  # SQL and raw-request logging live in application-dev.yml (SPRING_PROFILES_ACTIVE=dev): raw
  # requests contain session cookies and login passwords and must never be logged in production.

management:
  server:
    # Actuator on its own port: the load balancer only forwards 8080, so metrics and health
    # details are reachable from inside the network (Prometheus, the orchestrator), not the internet.
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      probes:
        enabled: true      # /actuator/health/liveness and /readiness for the orchestrator
      show-details: always # only on the internal port
  health:
    # Redis only caches menus; its outage degrades latency, it must not take the instance out of rotation.
    redis:
      enabled: false
  metrics:
    tags:
      application: online-order
    distribution:
      percentiles-histogram:
        http.server.requests: true   # histogram buckets, so p95/p99 can be aggregated across instances
      slo:
        http.server.requests: 50ms, 100ms, 300ms, 1s
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
  # Traces are exported only when MANAGEMENT_OTLP_TRACING_ENDPOINT is set (e.g.
  # http://otel-collector:4318/v1/traces). Without it trace ids still appear in the logs and the
  # X-Trace-Id header.
  info:
    env:
      enabled: true

info:
  app:
    name: online-order
