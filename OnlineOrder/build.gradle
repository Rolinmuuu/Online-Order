plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.9'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.laioffer'
version = '0.0.1-SNAPSHOT'
description = 'OnlineOrder'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // metrics in Prometheus format; traces (W3C traceparent) exported over OTLP when configured
    // OpenAPI description and Swagger UI, served on the internal management port
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    // compile scope: OrderUpdatesHub uses the driver's LISTEN/NOTIFY API (PGConnection)
    implementation 'org.postgresql:postgresql:42.7.7'
    // sessions in PostgreSQL: survive restarts and deploys, shared by every instance
    implementation 'org.springframework.session:spring-session-jdbc'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // OpenApiContractTests compares the API with this file: a change to it must re-run the tests.
    inputs.file('../docs/openapi.json')
}

// ── Frontend ──────────────────────────────────────────────────────────────────────────────
// The React app (../doordash-app) is built by npm and packaged into the jar under public/,
// which Spring Boot serves as static content. The built files are not committed.
//   ./gradlew bootJar -PwithFrontend    runs npm ci + npm run build first
//   ./gradlew bootJar                   packages ../doordash-app/build if it exists
//   -PfrontendDist=<dir>                packages an already-built directory (the Docker build)
def frontendDir = file('../doordash-app')
def frontendDist = file(findProperty('frontendDist') ?: "${frontendDir}/build")

tasks.register('buildFrontend', Exec) {
    group = 'build'
    description = 'Installs and builds the React app with npm.'
    workingDir frontendDir
    inputs.dir("${frontendDir}/src")
    inputs.files("${frontendDir}/package-lock.json", "${frontendDir}/index.html", "${frontendDir}/vite.config.ts")
    inputs.dir("${frontendDir}/public")
    outputs.dir("${frontendDir}/build")
    commandLine 'sh', '-c', 'npm ci --no-audit --no-fund && npm run build'
}

tasks.named('processResources') {
    if (project.hasProperty('withFrontend')) {
        dependsOn 'buildFrontend'
    }
    from(frontendDist) {
        into 'public'
    }
}
