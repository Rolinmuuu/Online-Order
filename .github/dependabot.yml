# Weekly dependency updates, grouped so minor/patch bumps arrive as one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /OnlineOrder
    schedule: { interval: weekly }
    groups:
      backend-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /doordash-app
    schedule: { interval: weekly }
    groups:
      frontend-minor:
        update-types: [minor, patch]
    ignore:
      # Pinned to match the CI/dev Chromium build; upgrade deliberately.
      - dependency-name: "@playwright/test"
      # antd 5 is a redesign (CSS-in-JS, new tokens): a planned migration, not a bump.
      - dependency-name: antd
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
