name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: onlineorder
          POSTGRES_PASSWORD: secret
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d onlineorder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: localhost
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: secret
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # integration tests (src/test/java/.../it) get a database of their own: they rebuild the
      # schema before every test, and must not share one with the Spring context test
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/onlineorder_test
      TEST_DATABASE_USER: postgres
      TEST_DATABASE_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Create the integration-test database
        run: PGPASSWORD=secret psql -h localhost -U postgres -c 'CREATE DATABASE onlineorder_test'
      - name: Unit and integration tests (real PostgreSQL)
        run: chmod +x gradlew && ./gradlew test
        working-directory: ./OnlineOrder
      - name: Build the jar
        run: ./gradlew build -x test
        working-directory: ./OnlineOrder

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./doordash-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: doordash-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    # The real jar (API + built frontend) against PostgreSQL, driven by Playwright in Chromium.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: onlineorder
          POSTGRES_PASSWORD: secret
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d onlineorder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: doordash-app/package-lock.json
      - name: Build the jar with the frontend
        run: chmod +x gradlew && ./gradlew bootJar -PwithFrontend
        working-directory: ./OnlineOrder
      - name: Start the application
        working-directory: ./OnlineOrder
        env:
          CACHE_TYPE: simple
          RATE_LIMIT_ENABLED: "false"   # the suite signs in more often than the login limit allows
        run: |
          nohup java -jar build/libs/OnlineOrder-*.jar > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8081/actuator/health/readiness && exit 0; sleep 2; done
          cat app.log; exit 1
      - name: Install Chromium
        working-directory: ./doordash-app
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: ./doordash-app
        run: npm run e2e
      - name: Upload the report and application log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            doordash-app/playwright-report
            doordash-app/test-results
            OnlineOrder/app.log
          retention-days: 7

  docker:
    # The production image builds (multi-stage: npm, Gradle, JRE runtime). Not pushed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: online-order:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  monitoring-config:
    # Alert rules and the Prometheus config must parse; a broken rule never fires.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.1.0 check config /etc/prometheus/prometheus.yml
      - name: Grafana dashboard is valid JSON
        run: python3 -m json.tool deploy/grafana/dashboards/online-order.json > /dev/null
      - name: Compose file is valid
        run: docker compose -f compose.yaml config -q
