# The whole system on one machine: the application image, PostgreSQL, Redis, and the
# monitoring it would have in production (Prometheus with the alert rules, Grafana with the
# dashboard). Demo mode: sample accounts and the simulated card processor.
#
#   docker compose up --build        app http://localhost:8080 · Grafana http://localhost:3001
#                                    Prometheus http://localhost:9090 (Alerts tab: the rules)
#
# For backend development without the app container: OnlineOrder/docker-compose.yml.
name: online-order

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: onlineorder
      POSTGRES_PASSWORD: secret
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d onlineorder"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: db
      REDIS_HOST: redis
      APP_DEMO: "true"
      TRACING_SAMPLE_RATE: "1.0"
    ports:
      - "8080:8080"   # the management port 8081 stays inside the compose network
    stop_grace_period: 30s

  prometheus:
    image: prom/prometheus:v3.1.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/online-order.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"

volumes:
  pg-data:
